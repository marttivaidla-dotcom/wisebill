# v3.1 needed for JSON schema's `type: "null"`
# v3.2 needed for tag's `kind` field.
openapi: "3.1.0"

info:
  title: Billberry API
  version: "0.1.337"

  summary:
    The HTTP and REST API of [Billberry](https://billberry.ee), the European e-invoice operator.

  description: |
    You'll find the full list of endpoints Billberry's API has below. It includes:
      * [Sending](#POST+/invoices) and [receiving](#GET+/invoices/received)  e-invoices on behalf of your own companies in multiple e-invoice formats.  
        For example, you can use the API to have your accounting software, e-commerce or webapp send e-invoices straight to its customers.

      * [Register your client's organizations](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) as senders and receivers if you're **Billberry's white-label customer**.

      * Confirm which organizations in a country [_can_ receive e-invoices](#GET+/countries/{countryCode}/organizations), or at least have announced they do.

    **There's no extra fee for using the API**.

    Both the organization and white-label partner APIs have introductory guides that go through the basics and get you up and running quickly. The guides are available both in Estonian and English:
    - [Billberry Client API Guide](https://billberry.ee/help/dev/billberry-client-api)
    - [Billberry White-Label Partner API Guide](https://billberry.ee/help/dev/billberry-partner-api/)

    There's also a guide on the [Estonian e-invoice format](https://billberry.ee/help/dev/estonian-einvoice-standard/) that may be useful. Billberry of course also supports the European UBL, Nordic TEAPPS and Finnish Finvoice formats.

    Don't forget to set the `Accept` header. ;)

    If you'd like to test the API or your integration, there's a staging/test environment entirely separate from the production environment. Register an account at <https://dev.billberry.ee> and email <hello@billberry.ee> to get some test-organizations associated with your testing account.

  contact:
    name: "Billberry"
    url: "https://billberry.ee"

externalDocs:
  description: Billberry Developer Documentation and Guides
  url: https://billberry.ee/help/dev/

servers:
  - url: "https://api.billberry.ee"
    x-name: "Billberry's Production API"

    description: |
      ### Billberry's Production API

  - url: "https://dev-api.billberry.ee"
    x-name: "Billberry's Staging API"

    description: |
      ### Billberry's Staging API

      The staging/test environment is entirely separate from production, so feel free to play around. To start, register an account at <https://dev.billberry.ee> and email <hello@billberry.ee> to get some test-organizations associated with your testing account.

      **For safety, don't test with production data**. Anonymize or generate random data instead.

security:
  - organization-session: []
  - partner-session: []

# https://spec.openapis.org/registry/tag-kind/
tags:
  - name: Organization Invoices
    kind: nav

    description: |
      Endpoints to send and receive on behalf of a single organization.

      These endpoints work with API keys that are scoped for a single organization. Such keys (or API sessions) may be generated by an organization representative in Billberry (the most common use-case), acquired via [OAuth2](/help/dev/billberry-oauth2/) or generated through the [white-label partner API sessions endpoint](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions).

      If you're using Billberry in a white-label fashion from a server side app, you don't need organization-scoped keys. Instead use the [White-Label Partner Invoices endpoints](#white-label-partner-invoices) (scoped under `/partners/{partnerId}`) to use Billberry with a single API key. The partner-scoped invoice endpoints (`/partners/{partnerId}/invoices`) work mostly identically to the root `/invoices` endpoints.

  - name: White-Label Partner Organizations
    kind: nav

    description: |
      Endpoints to manage a white-label partner's organizations (clients).

      Before you can send e-invoices on behalf of a client, you must register them in Billberry's system. Registration helps Billberry verify the invoice being sent is from your client and also facilitates billing between Billberry and you, the partner. Registration is also necessary if your client wants to receive e-invoices, which in turn requires Billberry to "register" them in various e-invoicing networks.

      **Before registering new clients and sending/receiving on behalf of them, it is essential to authenticate the client and verify their representation rights ("know your customer")**. Both physical identity checks and digital e-identity methods are sufficient (ID-cards, etc.). In Estonia, for example, representation rights can be confirmed using the Estonian [e-Business Register](https://ariregister.rik.ee).

      In exceptional cases, a bank transfer from the company's account can also be considered as permission if both your and your client's banks transmit the registry code of payer. Access to a company's bank account implies that the accountant has been authorized to act on behalf of the company. **By registering a client through the API, you assert that you've verified their representation right.**

  - name: White-Label Partner Invoices
    kind: nav

    description: |
      Endpoints for a white-label partner to send and receive their clients' invoices.

      Before you can send on behalf of your client, you must register them as a sender. See the [`PUT /partners/{partnerId}/organizations/…`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) endpoint for doing so.

      Why separate addresses for client-specific keys? So the API use can be identical for organization-specific keys, regardless of whether the key was generated by the client (through Billberry's web), acquired via [OAuth2](/help/dev/billberry-oauth2/) or by the partner (via the partner API). This allows the software to support the use case where the client copies the API key from Billberry's web to the application without changes. On the other hand, the partner's key provides access to all the partner's clients' invoices at once and deserves a different address, even if only to avoid potential errors.

  - name: White-Label Partner Orders
    kind: nav

    description: |
      Endpoints for a white-label partner to receive their clients' orders.

      Before you can receive on behalf of your client, you must register them as a receiver. See the [`PUT /partners/{partnerId}/organizations/…`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) endpoint for doing so.

  - name: Countries
    kind: nav

    description: |
      Metadata about organizations in various countries.

paths:
  /invoices:
    post:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Create (and send) a new invoice.
      description: |
        Create an invoice under your organization's account and, if requested via the `X-Send` header, send it immediately.  
        If sending fails, the invoice doesn't get created.

        When sending as a Billberry white-label partner and using your partner API session, use the [`POST /partners/{partnerId}/invoices`](#POST+/partners/{partnerId}/invoices) endpoint.

        All operator forwarding requests are set to time out in 15 seconds. If another operator does not respond in time, you'll see `504 {Operator} Timeout`.

      parameters:
        - $ref: "#/components/parameters/X-Send"

      requestBody: {$ref: "#/components/requestBodies/Einvoice"}

      responses:
        201:
          description: "### Sent"
          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

        403:
          description: |
            ### Invoice Not From Your Organization
            The invoice seems to be from an organization that doesn't match the authenticated session.

            ### ~~Only Immediate Sending Permitted~~
            Deprecated in favor of `Invalid X-Send Header`.

            ### Sending Not Enabled For Partner's Organization
            This is only returned if the current authenticated session was created by a partner via [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions).

            While the invoice seems to be from an organization that's registered under this partner, its sending is disabled. See [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) to enable sending.

            ### Seller Rejected By Bank
            Estonian banks other than Swedbank need to confirm sellers before they accept invoices from them. If for some reason the bank rejected your organization, get in touch and we'll investigate.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        409:
          description: |
            ### Organization Doesn't Accept E-Invoices
            ### Finbite Rejected Duplicate Invoice
            ### Telema Rejected Duplicate Invoice

            ### Telema Rejected Receiver
            Happens if Telema is still announcing the receiver as a customer of theirs, but internally had already disabled them.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        415:
          description: |
            ### Only E-Invoice XML Supported
            Deprecated in favor of `Unsupported Content Type`.

            ### Unsupported Content Type

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        422:
          description: |
            ### Missing E-Invoice
            ### Unknown XML E-Invoice

            ### Mismatching E-Invoice Format
            Returned when you explicitly state the e-invoice format via `Content-Type`, but the body differs from it.

            ### XML Parsing Failed
            ### E-Arve Parsing Failed
            ### E-Arve Empty
            ### Multiple E-Arve Invoices
            ### Finvoice Parsing Failed
            ### TEAPPS Parsing Failed
            ### TEAPPS Empty
            ### Multiple TEAPPS Invoices
            ### UBL Parsing Failed
            ### Finbite Error
            ### Finbite Rejected Invalid Invoice
            ### Telema Error
            ### Telema Rejected Invalid Invoice

            ### Invalid X-Send Header
            Use the `X-Send: immediately` header to request sending the invoice.

            ### Unknown Channel
            Arises when the Estonian e-invoice's `<Invoice channelId>` attribute contains an unknown channel identifier. The channel identifier is used, for example, for directing Estonian e-invoices to banks instead of their default destination — another local operator. In that case, the `channelId` is expected to be the bank's BIC, and the `channelAddress` attribute the recipient's IBAN. If you don't intend to direct the invoice elsewhere, leave the `channelId` attribute out entirely.

            ### No Bank Channel Plan
            Indicates that sending e-invoices to banks isn't yet enabled on Billberry's website. As sending e-invoices to banks is a paid feature, it's not enabled automatically.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        501:
          description: |
            ### Unsupported Operator
            Returned when the receiver uses an operator that's unknown to Billberry. This could happen if a new operator has entered the network in Estonia or Finland and hasn't yet connected to Billberry.

            You should find the name or identifier of the unknown operator in the `description`.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        502:
          description: |
            ### Sending Failed

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        503:
          description: |
            ### Seller Not Yet Accepted By Bank
            Estonian banks other than Swedbank need to confirm sellers before they accept invoices from them. That usually takes the banks' systems a few hours and happens behind the scenes. Until then, you'll get a 5xx response code suggesting you try again later. If they reject the sender outright, you'll get `403 Seller Rejected By Bank`

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        504:
          description: |
            ### E-arveldaja Timeout
            ### Finbite Timeout
            ### Telema Timeout
            ### Unifiedpost Timeout

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoices/received:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get all received invoices.
      description: |
        Returns an array of metadata of received invoices for your organization.  
        To get the original e-invoice XML for a given invoice, see [`/invoices/{invoiceId}`](#GET+/invoices/{invoiceId}).

        See the `Link` header documentation below for how to request updates, that is, only new invoices.

      parameters:
        - $ref: "#/components/parameters/invoiceReceivedAt"

      responses:
        200:
          description: "### OK"

          headers:
            Link: {$ref: "#/components/headers/InvoiceLink"}

          content:
            application/vnd.billberry.invoice+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceV1"

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoices/{invoiceId}:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get the invoice metadata or its e-invoice file (e.g. XML).

      description: |
        Note that the returned MIME types of the e-invoice files may have metadata attributes not listed here. For example, the Estonian e-arve may include a version — `application/vnd.billberry.earve+xml; v=1.2`. The UBL invoice may include the values of `<CustomizationID>` and `<ProfileID>` to help you identify the customization (e.g. compatibility with EN 16931 or with PEPPOL's BIS 3.0).

        If your app supports multiple formats, you can pass them via the HTTP `Accept` header:

        ```
        GET /invoices/{invoiceId}
        Accept:
          application/vnd.billberry.ubl-invoice+xml,
          application/vnd.billberry.ubl-credit-note+xml,
          application/vnd.billberry.earve+xml
        ```

        Billberry will pick the first suitable format, preferring to avoid conversions. If the e-invoice is in a format you don't supply in `Accept`, Billberry will convert to your preferred accepted format.

      parameters:
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

            application/vnd.billberry.earve+xml:
              schema: {$ref: "#/components/schemas/Earve"}

            application/vnd.billberry.finvoice+xml:
              schema: {$ref: "#/components/schemas/Finvoice"}

            application/vnd.billberry.teapps+xml:
              schema: {$ref: "#/components/schemas/Teapps"}

            application/vnd.billberry.ubl-invoice+xml:
              schema: {$ref: "#/components/schemas/UblInvoice"}

            application/vnd.billberry.ubl-credit-note+xml:
              schema: {$ref: "#/components/schemas/UblCreditNote"}

        403:
          description: |
            ### Invoice Not For Partner
            Can only happen when requesting with a session (API key) associated with a partner of Billberry.

            Indicates the invoice exists and belongs to the organization, but isn't available for the partner. This can happen for a couple of reasons:

            - For received invoices, the organization wasn't a client of the partner at the time.
            - For received invoices, the organization was a client of the partner, but the partner hadn't enabled receiving invoices.
            - For sent invoices, the partner didn't send the invoice.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        406:
          description: |
            ### Cannot Convert To Accepted Formats
            None of the formats in the `Accept` header are the invoice's original format nor can Billberry convert to them.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoices/{invoiceId}.xml:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get the invoice in the Estonian e-Invoice XML format.
      description: |
        The XML follows the [Estonian e-Invoice XML format](https://itl.ee/e-arve-kirjeldus/) specification.

      parameters:
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/xml:
              schema: {$ref: "#/components/schemas/Earve"}

        403:
          description: |
            ### Invoice Not For Partner
            When using a partner-scoped API session, but the invoice was neither sent by the partner nor received while the organization was the partner's customer.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoices/{invoiceId}.pdf:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get the secondary PDF of the invoice.
      deprecated: true
      description: |
        One Estonian e-invoice operator (namely
        [E-arveldaja](https://e-arveldaja.rik.ee)) also sends the PDF version of the invoice separately. That is, not via the `<E_Invoice>`'s `<AttachmentFile>` tag, but through a proprietary channel. This path can be used to obtain it. You can use the `pdfSize` invoice attribute to confirm its existence.

        As of Feb 23, 2023 **Billberry reattaches this externally sent PDF to the e-invoice as an `<AttachmentFile>` element**, making this path redundant. While it is theoretically possible for E-arveldaja to both send an attachment and a secondary PDF, it's unlikely and in our view not worth handling. Most other operators tend not to accept invoices with non-PDF attachments anyways, making them rare.

      parameters:
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/pdf:
              schema: {$ref: "#/components/schemas/Pdf"}

        403:
          description: |
            ### Invoice Not For Partner
            When using a partner-scoped API session, but the invoice was neither sent by the partner nor received while the organization was the partner's customer.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: |
            ### Invoice Not Found
            ### PDF Not Found

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoices/{invoiceId}/acknowledgements:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get acknowledgements for a specific invoice.

      parameters:
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                type: array
                items: {$ref: "#/components/schemas/InvoiceAcknowledgementV1"}

        403:
          description: |
            ### Invoice Not For Partner

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoice-acknowledgements:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get invoice acknowledgements.
      description: |
        Returns an array of invoice acknowledgements for your organization's invoices, both for sent and received invoices.

        An acknowledgement indicates whether a particular delivery of an invoice was confirmed or rejected by the recipient or their operator. Note that not all e-invoice networks, operators or recipients acknowledge invoices, so the lack of an acknowledgement doesn't indicate failure.

        The `ok` attribute is `true` when the delivery was confirmed as accepted and `false` when rejected. Generally rejected deliveries include a `message` explaining the reason.

        Note that there may be multiple acknowledgements sent for a single invoice and delivery. It's up to the recipient, after all, to send them.

        See the `Link` header documentation below for how to request updates, that is, only new acknowledgements.

        To simplify getting only acknowledgements for your sent invoices, there's an `invoice-direction` query parameter, which you can set to `sent`. Querying for sent invoices' acknowledgements also returns the updates URL in a `Link` header for fetching only updates later.

      parameters:
        -
          in: query
          name: invoice-direction

          description: |
            Filter acknowledgements by invoice direction.

          schema:
            type: string
            enum: ["sent", "received"]

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceAcknowledgementV1"

          headers:
            Link: {$ref: "#/components/headers/InvoiceAcknowledgementLink"}

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /invoice-acknowledgements/{acknowledgementId}:
    get:
      tags: [Organization Invoices]
      security: [{organization-session: []}]
      summary: Get an invoice acknowledgement.
      description: Returns a single invoice acknowledgement by its id.

      parameters:
        - $ref: "#/components/parameters/acknowledgementId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                $ref: "#/components/schemas/InvoiceAcknowledgementV1"

        403:
          description: "### Invoice Acknowledgement Not For Partner"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Acknowledgement Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /countries/{countryCode}/organizations:
    get:
      tags: [Countries]
      security: [{}]

      summary:
        Get a list of every organization in the country accepting e-invoices.

      description: |
        Don't forget the `receiving=true` query parameter. This is for forward-compability for when the organization list starts including information not only related to receiving operators.

        Note that the Estonian e-invoice receiver database is updated only once per day at midnight Tallinn time, so if you're downloading the entire list, there's no benefit in doing it more often than once per day.

      parameters:
        - $ref: "#/components/parameters/countryCode"

        -
          in: query
          name: receiving

          description: |
            Whether to only return organizations that accept e-invoices.

          required: true

          schema:
            type: boolean
            example: true

        -
          in: query
          name: include[]

          description: |
            Which fields in the organization object to include in addition to the defaults.

            E.g. if you want to get the organization name, add `include[]=name` to the query.

          default:
            - country
            - registryCode
            - receivingOperator

          schema:
            type: array
            items:
              type: string
              enum:
                - country
                - registryCode
                - name
                - receivingOperator

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.country-organization+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountryOrganizationV1"

        400:
          description: |
            ### Invalid Country Code

            ### Only E-Invoice-Receiving Organizations Available
            Add the `receiving=true` query parameter.

            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /countries/{countryCode}/organizations/{registryCode}:
    get:
      tags: [Countries]
      security: [{}]

      summary: |
        Get info and the receiving e-invoice operator for a single organization in the country.

      description: |
        Note that this returns `404 Organization Not Found` if the organization has never been seen to receive e-invoices. If the organization has at one point received e-invoices, but doesn't any more, `receivingOperator` is `null`.

      parameters:
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.country-organization+json; v=1:
              schema: {$ref: "#/components/schemas/CountryOrganizationV1"}

        400:
          description: |
            ### Invalid Country Code
            ### Invalid Estonian Registry Code
            ### Invalid Finnish Registry Code
            ### Invalid Latvian Registry Code
            ### Invalid Lithuanian Registry Code
            ### Invalid Swedish Registry Code
            ### Invalid Slovakian Registry Code
            ### Invalid Italian Registry Code

            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Organization Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/organizations:
    get:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Get a list of partner's registered organizations.
      description: |
        This returns only active registrations and skips deleted ones.

      parameters:
        - $ref: "#/components/parameters/partnerId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.partner-organization+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerOrganizationV1"

  "/partners/{partnerId}/organizations/{countryCode}:{registryCode}":
    get:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Get the info of a partner's registered organization.
      description: &read-partner-organization-description |
        This returns only active registrations.  
        Previously registered, but deleted ones, result in 410.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.partner-organization+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerOrganizationV1"

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        410:
          description: "### Organization Unregistered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

    put:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Register an organization as a client of the partner.
      description: &update-partner-organization-description |
        Registering is idempotent. That is, if the organization was already
        registered when you `PUT`, it'll do nothing, and return `200
        Organization Up-to-Date` or `200 Organization Updated` depending on
        whether you updated any attributes.

        If you don't include a request body (and leave `Content-Type` empty), it'll default to enabling e-invoice sending, but not receiving. In other words, it's as if you'd set the body to:

        ```json
        {"sendingEnabled": true}
        ```

        ## Receiving for Estonian Organizations
        Note than when you enable receiving for an Estonian organization, Billberry also sets itself as the client's e-invoice operator in the Estonian Business Register. To complete the process, you'll need to direct your client to the [Estonian Business Register](https://ariregister.rik.ee) to confirm their new operator.

        Confirming Billberry is available in the Business Register for 7 days (their limit). If you want to retrigger the confirmation once expired, you can `PUT` again. Retriggering prior to 7 days (86400 * 7 seconds) does nothing.

        The Estonian Business Register request is set to time out in 15 seconds. If it does not respond in time, you'll see `504 Estonian Business Register Timeout`. If they have internal errors, you'll see `502 Estonian Business Register Internal Error`.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      requestBody: &update-partner-organization-request
        required: false

        content:
          application/vnd.billberry.partner-organization+json; v=1:
            schema:
              type: object
              properties:
                sendingEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/sendingEnabled"}
                sendingNetworks: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/sendingNetworks"}
                receivingEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/receivingEnabled"}
                receivingNetworks: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/receivingNetworks"}
                creatingSentEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/creatingSentEnabled"}
                creatingReceivedEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/creatingReceivedEnabled"}
                orderSendingEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/orderSendingEnabled"}
                orderReceivingEnabled: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/orderReceivingEnabled"}
                orderReceivingNetworks: {$ref: "#/components/schemas/PartnerOrganizationV1/properties/orderReceivingNetworks"}

      responses: &update-partner-organization-responses
        200:
          description: |
            ### Organization Up-to-Date
            ### Organization Updated

            ### Estonian Business Register Updated
            Returned only if receiving was previously enabled and the operator confirmation in the business register is expired at the time of the request.

          content:
            application/vnd.billberry.partner-organization+json; v=1:
              schema:
                $ref: "#/components/schemas/PartnerOrganizationV1"

        201:
          description: "### Organization Registered"
          content:
            application/vnd.billberry.partner-organization+json; v=1:
              schema:
                $ref: "#/components/schemas/PartnerOrganizationV1"

        403:
          description: |
            ### Partner Invoice Sending Disabled
            Not all partners may need invoice sending, so it's possible it's disabled.

            ### Partner Invoice Receiving Disabled
            Not all partners may need invoice receiving, so it's possible it's disabled.

            ### Partner Invoice Creating Received Disabled
            Not all partners may need creating received invoices, so it's possible it's disabled.

            ### Partner Order Sending Disabled
            Not all partners may need order sending, so it's possible it's disabled.

            ### Partner Order Receiving Disabled
            Not all partners may need order receiving, so it's possible it's disabled.

            ### Organization Disabled Partner Invoice Sending
            It's possible for organizations that also use Billberry directly to limit partner invoice sending for security reasons.

            ### Organization Disabled Partner Invoice Receiving
            It's possible for organizations that also use Billberry directly to limit partner invoice receiving for security reasons.

            ### Organization Disabled Partner Invoice Creating Received
            It's possible for organizations that also use Billberry directly to limit partners from creating received invoices for security reasons.

            ### Organization Disabled Partner Order Sending
            It's possible for organizations that also use Billberry directly to limit partner order sending for security reasons.

            ### Organization Disabled Partner Order Receiving
            It's possible for organizations that also use Billberry directly to limit partner order receiving for security reasons.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        409:
          description: |
            ### Receiving in Estonia Only Supported For Estonian Organizations
            When registering a non-Estonian organization, but explicitly setting `receivingNetworks.estonia` to `true`.

            ### Participant Already Registered in PEPPOL
            The PEPPOL network works on a first-come-first-served system when registering new receivers. If some other operator has already registered a particular participant on the PEPPOL network, Billberry can't override it, and returns this error.

            ### Country Not Supported By PEPPOL
            When explicitly setting `receivingNetworks.peppol` or `orderReceivingNetworks.peppol` to `true` for a country PEPPOL doesn't support.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        502:
          description: |
            ### Estonian Business Register Internal Error
            ### Failed to Register in PEPPOL SML
            ### Failed to Register in Omani SMP

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        504:
          description: "### Estonian Business Register Timeout"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

    delete:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Unregister an organization as a client of the partner.

      description: &delete-partner-organization-description |
        Unregistering is idempotent. That is, if the organization was already
        unregistered when invoked `DELETE`, it'll return `410 Organization
        Already Unregistered`.

        Any organization-scoped sessions created with [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions) will also be deleted.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      responses: &delete-partner-organization-responses
        204:
          description: "### Organization Unregistered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        410:
          description: "### Organization Already Unregistered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/organizations/{estonianRegistryCode}:
    get:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Get the info of a partner's registered Estonian organization.
      description: *read-partner-organization-description

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.partner-organization+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerOrganizationV1"

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        410:
          description: "### Organization Unregistered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

    put:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Register an Estonian organization as a client of the partner.
      description: *update-partner-organization-description

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"

      requestBody: *update-partner-organization-request
      responses: *update-partner-organization-responses

    delete:
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Unregister an Estonian organization as a client of the partner.
      description: *delete-partner-organization-description

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"

      responses: *delete-partner-organization-responses

  "/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions":
    get: &search-partner-organization-sessions
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Get a list of organization's sessions (API keys) created by the partner.
      description: |
        This returns only valid sessions and skips deleted ones.

        Note that session tokens won't be returned and will be `null`.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.session+json; v=1:
              schema:
                $ref: "#/components/schemas/SessionV1"

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

    post: &create-partner-organization-session
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Create a new API key (session) scoped to a single organization.
      description: |
        In situations where you need to permit your client to access the Billberry API directly (in desktop software, for example), you can create API keys scoped to a single client.

        The returned session object contains both the API key `id` and `token`, which you can then use for HTTP Basic Authentication's username and password respectively.

        Note that for the sending and receiving e-invoices using a scoped API key, you'll need to use the general [`POST /invoices`](#POST+/invoices) and [`GET /invoices/received`](#GET+/invoices/received) endpoints, rather than the ones prefixed with `/partners`. While it may seem odd, this means the API endpoints for all organization-scoped API keys are the same — regardless of whether they were generated by a partner or generated by an organization themselves on Billberry's website. A partner fetching invoices for all of their clients in one request is sufficiently different to warrant a prefixed path (e.g. [`/partners/{partnerId}/invoices`](#POST+/partners/{partnerId}/invoices)).

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"

      responses:
        201:
          description: "### Session Created"
          content:
            application/vnd.billberry.session+json; v=1:
              schema:
                $ref: "#/components/schemas/SessionV1"

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/organizations/{estonianRegistryCode}/sessions:
    get:
      <<: *search-partner-organization-sessions

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"

    post:
      <<: *create-partner-organization-session

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"

  "/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions/{sessionId}":
    delete: &delete-partner-organization-session
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Delete a session.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"
        - $ref: "#/components/parameters/sessionId"

      responses:
        204:
          description: "### Session Deleted"

        404:
          description: "### Session Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        410:
          description: "### Session Deleted"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/organizations/{estonianRegistryCode}/sessions/{sessionId}:
    delete:
      <<: *delete-partner-organization-session

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"
        - $ref: "#/components/parameters/sessionId"

  "/partners/{partnerId}/organizations/{countryCode}:{registryCode}/invoices/received":
    get: &search-partner-organization-received-invoices
      tags: [White-Label Partner Organizations]
      security: [{partner-session: []}]
      summary: Get received invoices on behalf of one of your clients.
      description: |
        Returns an array of metadata of received invoices for a single client.  
        To get the original e-invoice XML for a given invoice, see [`GET /partners/{partnerId}/invoices/{invoiceId}`](#GET+/partners/{partnerId}/invoices/{invoiceId}).  
        If you're going to need invoices for all of your clients anyways, see [`GET /partners/{partnerId}/invoices/receievd`](#GET+/partners/{partnerId}/invoices/receievd) to request all in one go.

        This differs from the unscoped [`/invoices/{invoiceId}`](#GET+/invoices/{invoiceId}) endpoint by requiring you to use your partner API key. Since the partner API key gives access to _all_ of your customers' data, its endpoints are kept intentionally separate from the organization-scoped endpoints (which sit above `/partners/{partnerId}`). To get organization-scoped keys for handing to your clients' systems (e.g. desktop apps), see [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions) and [`GET /invoices/received`](#GET+/invoices/received).

        You'll only see received invoices for clients that were associated with your partner account (via [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode})) at the time of receiving.

        See the `Link` header documentation below for how to request updates, that is, only new invoices.

        Note that this endpoint only works with the partner API key. If you're using API keys scoped to an organization (from [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions)), you'll need to use [`GET /invoices/received`](#GET+/invoices/received).

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/countryCode"
        - $ref: "#/components/parameters/registryCode"
        - $ref: "#/components/parameters/invoiceReceivedAt"

      responses:
        200:
          description: "### OK"

          headers:
            Link: {$ref: "#/components/headers/InvoiceLink"}

          content:
            application/vnd.billberry.invoice+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceV1"

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Organization Not Registered"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/organizations/{estonianRegistryCode}/invoices/received:
    get:
      <<: *search-partner-organization-received-invoices

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/estonianRegistryCode"
        - $ref: "#/components/parameters/invoiceReceivedAt"

  /partners/{partnerId}/invoices:
    post:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Create (and send) a new invoice.
      description: |
        Send a new invoice as Billberry's partner on behalf of your client.  
        If sending fails, the invoice doesn't get created.

        All operator forwarding requests are set to time out in 15 seconds. If another operator does not respond in time, you'll see `504 {Operator} Timeout`.

        Note that this endpoint only works with the partner API key. If you're using API keys scoped to an organization (from [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions)), you'll need to use [`POST /invoices`](#POST+/invoices) for sending.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/X-Send"

      requestBody: {$ref: "#/components/requestBodies/Einvoice"}

      responses:
        201:
          description: "### Sent"
          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

        403:
          description: |
            ### Invoice Not From A Partner's Organization
            The invoice seems to be from an organization that hasn't been registered under this partner.

            ### Sending Not Enabled For Partner's Organization
            While the invoice seems to be from an organization that's registered under this partner, its sending is disabled. See [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) to enable sending.

            ### Only Immediate Sending Permitted
            Deprecated in favor of `Invalid X-Send Header`.

            ### Seller Rejected By Bank
            Estonian banks other than Swedbank need to confirm sellers before they accept invoices from them. If for some reason the bank rejected your organization, get in touch and we'll investigate.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        409:
          description: |
            ### Organization Doesn't Accept E-Invoices
            ### Finbite Rejected Duplicate Invoice
            ### Telema Rejected Duplicate Invoice

            ### Telema Rejected Receiver
            Happens if Telema is still announcing the receiver as a customer of theirs, but internally had already disabled them.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        415:
          description: |
            ### Only E-Invoice XML Supported
            Deprecated in favor of `Unsupported Content Type`.

            ### Unsupported Content Type

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        422:
          description: |
            ### Missing E-Invoice
            ### Unknown XML E-Invoice

            ### Mismatching E-Invoice Format
            Returned when you explicitly state the e-invoice format via `Content-Type`, but the body differs from it.

            ### XML Parsing Failed
            ### E-Arve Parsing Failed
            ### E-Arve Empty
            ### Multiple E-Arve Invoices
            ### Finvoice Parsing Failed
            ### TEAPPS Parsing Failed
            ### TEAPPS Empty
            ### Multiple TEAPPS Invoices
            ### UBL Parsing Failed
            ### Finbite Error
            ### Finbite Rejected Invalid Invoice
            ### Telema Error
            ### Telema Rejected Invalid Invoice

            ### Invalid X-Send Header
            Use the `X-Send: immediately` header to request sending the invoice.

            ### Unknown Channel
            Arises when the Estonian e-invoice's `<Invoice channelId>` attribute contains an unknown channel identifier. The channel identifier is used, for example, for directing Estonian e-invoices to banks instead of their default destination — another local operator. In that case, the `channelId` is expected to be the bank's BIC, and the `channelAddress` attribute the recipient's IBAN. If you don't intend to direct the invoice elsewhere, leave the `channelId` attribute out entirely.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        501:
          description: |
            ### Unsupported Operator
            Returned when the receiver uses an operator that's unknown to Billberry. This could happen if a new operator has entered the network in Estonia or Finland and hasn't yet connected to Billberry.

            You should find the name or identifier of the unknown operator in the `description`.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        502:
          description: |
            ### Sending Failed
            ### Telema Error

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        503:
          description: |
            ### Seller Not Yet Accepted By Bank
            Estonian banks other than Swedbank need to confirm sellers before they accept invoices from them. That usually takes the banks' systems a few hours and happens behind the scenes. Until then, you'll get a 5xx response code suggesting you try again later. If they reject the sender outright, you'll get `403 Seller Rejected By Bank`

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        504:
          description: |
            ### E-arveldaja Timeout
            ### Finbite Timeout
            ### Telema Timeout
            ### Unifiedpost Timeout

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/sent:
    post:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Create (or upload) sent invoices.
      description: |
        Creating sent invoices is meant for uploading invoices sent externally, such as perhaps by email or post. Billberry doesn't send them again to the receiver, but will make them available to the client's accounting software.

      parameters:
        - $ref: "#/components/parameters/partnerId"

      requestBody: {$ref: "#/components/requestBodies/Einvoice"}

      responses:
        201:
          description: |
            ### Created
            The invoice was stored successfully.

          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

        403:
          description: |
            ### Invoice Not From A Partner's Organization
            The invoice seems to be from an organization that wasn't registered under this partner.

            ### Creating Sent Invoices Not Enabled For Partner's Organization
            While the invoice seems to be from an organization that's registered under this partner, creating sent invoices for it is disabled. See [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) to enable creating sent invoices.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        415:
          description: |
            ### Unsupported Content Type

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        422:
          description: |
            ### Unknown XML E-Invoice

            ### Mismatching E-Invoice Format
            Returned when you explicitly state the e-invoice format via `Content-Type`, but the body differs from it.

            ### XML Parsing Failed
            ### E-Arve Parsing Failed
            ### E-Arve Empty
            ### Multiple E-Arve Invoices
            ### Finvoice Parsing Failed
            ### TEAPPS Parsing Failed
            ### TEAPPS Empty
            ### Multiple TEAPPS Invoices
            ### UBL Parsing Failed

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/received:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get received invoices on behalf of all of your clients.
      description: |
        Returns an array of metadata of received invoices for all of your clients.  
        To get the original e-invoice XML for a given invoice, see [`GET /partners/{partnerId}/invoices/{invoiceId}`](#GET+/partners/{partnerId}/invoices/{invoiceId}).

        You can identify the owner of an invoice via the `registryCode` attribute, which will match your registered client's. As this endpoint only returns received invoices, the `registryCode` attribute matches `receiverRegistryCode`.

        You'll only see received invoices for clients that were associated with your partner account (via [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode})) at the time of receiving. If you [`DELETE`](#DELETE+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) a client, their old invoices will still be visible to you, but new arrivals won't.

        See the `Link` header documentation below for how to request updates, that is, only new invoices.

        Note that this endpoint only works with the partner API key. If you're using API keys scoped to an organization (from [`POST /partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions`](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions)), you'll need to use [`GET /invoices/received`](#GET+/invoices/received).

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/invoiceReceivedAt"

      responses:
        200:
          description: "### OK"

          headers:
            Link: {$ref: "#/components/headers/InvoiceLink"}

          content:
            application/vnd.billberry.invoice+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceV1"

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

    post:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Create (or upload) received invoices.
      description: |
        Creating received invoices is meant for uploading invoices received externally, such as scanned purchase receipts, to Billberry, where they'll become available to the client's accounting software just like regular received invoices.

        By default **the created received invoices will only be visible within Billberry** (and its API). That is, the organization isn't require to have enabled e-invoice receiving at any operator or they could be using a different operator.

        If you do want such received invoices **forwarded to other operators**, **pass the `X-Forward` header** along with your request. Billberry will then only accept invoices when the organization has enabled e-invoices at _some_ operator, and forward the invoice to the appropriate operator. If the organization hasn't enabled e-invoice receiving, you'll get `409 Organization Doesn't Accept E-Invoices` error. If sending fails, the invoice doesn't get created.

        If you wish to *optionally* forward invoices — for example only forward when the organization uses another operator and create locally when they don't — let us know! Right now you'd have to first try the request with `X-Forward` and upon seeing `409 Organization Doesn't Accept E-Invoices`, try again without `X-Forward`.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/X-Forward"

      requestBody: {$ref: "#/components/requestBodies/Einvoice"}

      responses:
        201:
          description: |
            ### Received
            If the invoice was received successfully and not forwarded to another oeprator.

            That may be because forwarding wasn't requested (e.g. no `X-Forward` header) or the organization received invoices at Billberry.

            ### Received and Forwarded
            If the invoice was successfully received and forwarded to another operator (i.e not Billberry).

            This will only be returned if you request forwarding with `X-Forward`, e.g. with `X-Forward: immediately`.

          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

        403:
          description: |
            ### Invoice Not To A Partner's Organization
            The invoice seems to be for an organization that wasn't registered under this partner.

            ### Creating Received Invoices Not Enabled For Partner's Organization
            While the invoice seems to be for an organization that's registered under this partner, creating received invoices for it disabled. See [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) to enable creating received invoices.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        409:
          description: |
            ### Organization Doesn't Accept E-Invoices
            Returned only if forwarding is requested (e.g. with `X-Forward: immediately`) and the organization isn't set to receive invoices with any operator.

            ### Finbite Rejected Duplicate Invoice
            ### Telema Rejected Duplicate Invoice

            ### Telema Rejected Receiver
            Happens if Telema is still announcing the receiver as a customer of theirs, but internally had already disabled them.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        415:
          description: |
            ### Only E-Invoice XML Supported
            Deprecated in favor of `Unsupported Content Type`.

            ### Unsupported Content Type

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        422:
          description: |
            ### Missing E-Invoice
            ### Unknown XML E-Invoice

            ### Mismatching E-Invoice Format
            Returned when you explicitly state the e-invoice format via `Content-Type`, but the body differs from it.

            ### XML Parsing Failed
            ### E-Arve Parsing Failed
            ### E-Arve Empty
            ### Multiple E-Arve Invoices
            ### Finvoice Parsing Failed
            ### TEAPPS Parsing Failed
            ### TEAPPS Empty
            ### Multiple TEAPPS Invoices
            ### UBL Parsing Failed
            ### Finbite Error
            ### Finbite Rejected Invalid Invoice
            ### Telema Error
            ### Telema Rejected Invalid Invoice

            ### Invalid X-Forward Header

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        501:
          description: |
            ### Unsupported Operator
            Returned when requesting forwarding (e.g. `X-Forward: immediately`) and the receiver uses an operator that's unknown to Billberry. This could happen if a new operator has entered the network in Estonia or Finland and hasn't yet connected to Billberry.

            You should find the name or identifier of the unknown operator in the `description`.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        502:
          description: |
            ### Forwarding Failed

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        504:
          description: |
            ### E-arveldaja Timeout
            ### Finbite Timeout
            ### Telema Timeout
            ### Unifiedpost Timeout

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/{invoiceId}:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get the invoice metadata or its e-invoice file (e.g. XML).

      description: |
        Note that the returned MIME types of the e-invoice files may have metadata attributes not listed here. For example, the Estonian e-arve may include a version — `application/vnd.billberry.earve+xml; v=1.2`. The UBL invoice may include the values of `<CustomizationID>` and `<ProfileID>` to help you identify the customization (e.g. compatibility with EN 16931 or with PEPPOL's BIS 3.0).

        If your app supports multiple formats, you can pass them via the HTTP `Accept` header:

        ```
        GET /partners/{partnerId}/{invoiceId}
        Accept:
          application/vnd.billberry.ubl-invoice+xml,
          application/vnd.billberry.ubl-credit-note+xml,
          application/vnd.billberry.earve+xml
        ```

        Billberry will pick the first suitable format, preferring to avoid conversions. If the e-invoice is in a format you don't supply in `Accept`, Billberry will convert to your preferred accepted format.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice+json; v=1:
              schema: {$ref: "#/components/schemas/InvoiceV1"}

            application/vnd.billberry.earve+xml:
              schema: {$ref: "#/components/schemas/Earve"}

            application/vnd.billberry.finvoice+xml:
              schema: {$ref: "#/components/schemas/Finvoice"}

            application/vnd.billberry.teapps+xml:
              schema: {$ref: "#/components/schemas/Teapps"}

            application/vnd.billberry.ubl-invoice+xml:
              schema: {$ref: "#/components/schemas/UblInvoice"}

            application/vnd.billberry.ubl-credit-note+xml:
              schema: {$ref: "#/components/schemas/UblCreditNote"}

        403:
          description: |
            ### Invoice Not For Partner
            Indicates the invoice exists, but isn't available for the partner. This can happen for a couple of reasons:

            - For received invoices, the organization wasn't a client of the partner at the time.
            - For received invoices, the organization was a client of the partner, but the partner hadn't enabled receiving invoices.
            - For sent invoices, the partner didn't send the invoice.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        406:
          description: |
            ### Cannot Convert To Accepted Formats
            None of the formats in the `Accept` header are the invoice's original format nor can Billberry convert to them.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/{invoiceId}.xml:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get the invoice in the Estonian e-Invoice XML format.
      description: |
        The XML follows the [Estonian e-Invoice XML
        format](https://itl.ee/e-arve-kirjeldus/) specification.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/xml:
              schema: {$ref: "#/components/schemas/Earve"}

        403:
          description: |
            ### Invoice Not For Partner
            When using a partner-scoped API session, but the invoice was neither sent by the partner nor received while the organization was the partner's customer.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/{invoiceId}.pdf:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get the associated PDF of the invoice.
      deprecated: true
      description: |
        One Estonian e-invoice operator (namely
        [E-arveldaja](https://e-arveldaja.rik.ee)) also sends the PDF version of the invoice separately. That is, not via the `<E_Invoice>`'s `<AttachmentFile>` tag, but through a proprietary channel. This path can be used to obtain it. You can use the `pdfSize` invoice attribute to confirm its existence.

        As of Feb 23, 2023 **Billberry reattaches this externally sent PDF to the e-invoice as an `<AttachmentFile>` element**, making this path redundant. While it is theoretically possible for E-arveldaja to both send an attachment and a secondary PDF, it's unlikely and in our view not worth handling. Most other operators tend not to accept invoices with non-PDF attachments anyways, making them rare.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/pdf:
              schema: {$ref: "#/components/schemas/Pdf"}

        403:
          description: |
            ### Invoice Not For Partner
            When using a partner-scoped API session, but the invoice was neither sent by the partner nor received while the organization was the partner's customer.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: |
            ### Invoice Not Found
            ### PDF Not Found

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoices/{invoiceId}/acknowledgements:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get acknowledgements for a specific invoice.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/invoiceId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                type: array
                items: {$ref: "#/components/schemas/InvoiceAcknowledgementV1"}

        403:
          description: |
            ### Invoice Not For Partner
            When using a partner-scoped API session, but the invoice was neither sent by the partner nor received while the organization was the partner's customer.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoice-acknowledgements:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get invoice acknowledgements.
      description: |
        Returns an array of invoice acknowledgements for your clients' invoices, both for sent and received invoices.

        An acknowledgement indicates whether a particular delivery of an invoice was confirmed or rejected by the recipient or their operator. Note that not all e-invoice networks, operators or recipients acknowledge invoices, so the lack of an acknowledgement doesn't indicate failure.

        The `ok` attribute is `true` when the delivery was confirmed as accepted and `false` when rejected. Generally rejected deliveries include a `message` explaining the reason.

        Note that there may be multiple acknowledgements sent for a single invoice and delivery. It's up to the recipient, after all, to send them.

        See the `Link` header documentation below for how to request updates, that is, only new acknowledgements.

        To simplify getting only acknowledgements for your sent invoices, there's an `invoice-direction` query parameter, which you can set to `sent`. Querying for sent invoices' acknowledgements also returns the updates URL in a `Link` header for fetching only updates later.

      parameters:
        - $ref: "#/components/parameters/partnerId"

        -
          in: query
          name: invoice-direction

          description: |
            Filter acknowledgements by invoice direction.

          schema:
            type: string
            enum: ["sent", "received"]

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceAcknowledgementV1"

          headers:
            Link: {$ref: "#/components/headers/InvoiceAcknowledgementLink"}

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/invoice-acknowledgements/{acknowledgementId}:
    get:
      tags: [White-Label Partner Invoices]
      security: [{partner-session: []}]
      summary: Get an invoice acknowledgement.
      description: Returns a single invoice acknowledgement by its id.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/acknowledgementId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.invoice-acknowledgement+json; v=1:
              schema:
                $ref: "#/components/schemas/InvoiceAcknowledgementV1"

        403:
          description: "### Invoice Acknowledgement Not For Partner"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Invoice Acknowledgement Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/orders/received:
    get:
      tags: [White-Label Partner Orders]
      security: [{partner-session: []}]
      summary: Get received orders on behalf of all of your clients.
      description: |
        Returns an array of metadata of received orders for all of your clients.  
        To get the original e-order XML for a given order, see [`GET /partners/{partnerId}/orders/{orderId}`](#GET+/partners/{partnerId}/orders/{orderId}).

        You can identify the owner of an order via the `organizationCountry` and `organizationRegistryCode` attributes, which will match your registered client's.

        You'll only see received orders for clients that were associated with your partner account (via [`PUT /partners/{partnerId}/organizations/{countryCode}:{registryCode}`](#PUT+/partners/{partnerId}/organizations/{countryCode}:{registryCode})) at the time of receiving. If you [`DELETE`](#DELETE+/partners/{partnerId}/organizations/{countryCode}:{registryCode}) a client, their old orders will still be visible to you, but new arrivals won't.

        See the `Link` header documentation below for how to request updates, that is, only new orders.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/orderReceivedAt"

      responses:
        200:
          description: "### OK"

          headers:
            Link: {$ref: "#/components/headers/OrderLink"}

          content:
            application/vnd.billberry.order+json; v=1:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderV1"

        400:
          description: |
            ### Invalid Query
            One or multiple query parameters were invalid. See the error response's `description` for more info.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

  /partners/{partnerId}/orders/{orderId}:
    get:
      tags: [White-Label Partner Orders]
      security: [{partner-session: []}]
      summary: Get the order metadata or its e-order file (e.g. XML).

      description: |
        Note that the returned MIME types of the e-order files may have metadata attributes not listed here. For example, the UBL order includes its UBL version — `application/vnd.billberry.ubl-order+xml; v=2.1`.

        If your app supports multiple formats, you can pass them via the HTTP `Accept` header:

        ```
        GET /partners/{partnerId}/orders/{orderId}
        Accept:
          application/vnd.billberry.order+json,
          application/vnd.billberry.ubl-order+xml
        ```

        Billberry will pick the first suitable format, preferring to avoid conversions. If the e-order is in a format you don't supply in `Accept`, Billberry will convert to your preferred accepted format.

      parameters:
        - $ref: "#/components/parameters/partnerId"
        - $ref: "#/components/parameters/orderId"

      responses:
        200:
          description: "### OK"
          content:
            application/vnd.billberry.order+json; v=1:
              schema: {$ref: "#/components/schemas/OrderV1"}

            application/vnd.billberry.ubl-order+xml:
              schema: {$ref: "#/components/schemas/UblOrder"}

        403:
          description: |
            ### Order Not For Partner
            Indicates the order exists, but isn't available for the partner. This can happen for a couple of reasons:

            - For received orders, the organization wasn't a client of the partner at the time.
            - For received orders, the organization was a client of the partner, but the partner hadn't enabled receiving orders.
            - For sent orders, the partner didn't send the order.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        404:
          description: "### Order Not Found"
          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

        406:
          description: |
            ### Cannot Convert To Accepted Formats
            None of the formats in `Accept` is the order's own format or one Billberry can convert it to.

          content:
            application/vnd.billberry.error+json; v=1:
              schema: {$ref: "#/components/schemas/Error"}

components:
  # https://spec.openapis.org/oas/v3.1.2.html#security-scheme-object
  securitySchemes:
    organization-session:
      x-summary: "Organization API Key"
      type: http
      scheme: basic

      description: |
        Organization-scoped API key.

        Get API credentials for your organization from <https://app.billberry.ee/accounts/me>, acquire them via [OAuth2](/help/dev/billberry-oauth2/) or generate them through the [white-label partner API sessions endpoint](#POST+/partners/{partnerId}/organizations/{countryCode}:{registryCode}/sessions).

        Use the session id as the HTTP Basic Authentication username and the session token as the password.

    partner-session:
      x-summary: "Partner API Key"
      type: http
      scheme: basic

      description: |
        White-label partner API key. Gives access to all of the partner's registered client organizations.

        Use the session id as the HTTP Basic Authentication username and the session token as the password.

  parameters:
    invoiceId:
      in: path
      name: invoiceId
      description: Invoice's id
      required: true
      schema:
        type: integer
        example: 42

    orderId:
      in: path
      name: orderId
      description: Order's id
      required: true
      schema:
        type: integer
        example: 42

    countryCode:
      in: path
      name: countryCode

      description: |
        Country [ISO 3166 alpha-2](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes) (two letter) code

      required: true

      schema:
        type: string
        enum: &countries
          - "AX"
          - "BE"
          - "DK"
          - "EE"
          - "FI"
          - "DE"
          - "LV"
          - "LT"
          - "SE"
          - "SK"
          - "IT"
          - "AE"
          - "OM"

    partnerId:
      in: path
      name: partnerId
      description: Partner's id
      required: true
      schema:
        type: string
        example: "bookie"

    acknowledgementId:
      in: path
      name: acknowledgementId
      description: Acknowledgement's id
      required: true
      schema:
        type: integer
        example: 13

    sessionId:
      in: path
      name: sessionId
      description: Session's id
      required: true
      schema:
        type: integer
        example: 68

    registryCode:
      in: path
      name: registryCode
      description: Organization's registry code
      required: true
      schema:
        type: string
        example: "16122596"

    estonianRegistryCode:
      in: path
      name: estonianRegistryCode
      description: Organization's Estonian registry code
      required: true
      schema:
        type: string
        example: "16122596"

    invoiceReceivedAt:
      in: query
      name: received-at

      description: |
        Filter invoices by `receivedAt` with UTC time in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`2025-06-18T13:37:42Z`).

        By (ab)using `<` and `>` in the parameter name and dropping `=`, you can form range queries:

        | Parameter | Op | Description |
        |-----------|----|-------------|
        | `received-at<2025-06-18T…` | `<` | Received before 2025-06-18T… |
        | `received-at<=2025-06-18T…` | `<=` | Received before or at 2025-06-18T… |
        | `received-at=2025-06-18T…` | `=` | Received exactly at 2025-06-18T… |
        | `received-at>=2025-06-18T…` | `>=` | Received after or at 2025-06-18T… |
        | `received-at>2025-06-18T…` | `>` | Received after 2025-06-18T… |

        You can repeat the parameter to target a specific month (e.g. June):  
        `/invoices/received?received-at%3e=2025-06-01T00:00:00Z&received-at%3c2025-07-01T00:00:00Z`

        Don't forget to ensure **query parameters are properly encoded**. Under [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986), `<` and `>` are only permitted as `%3c` and `%3e` respectively. Most HTTP/URI libraries do this for you.

        Note that an invoice's **`receivedAt` is not monotonically increasing**. That is, "newer" invoices may appear with older `receivedAt` times due to processing idiosyncrasies. If your goal is to grab newly arrived invoices at midnights for the previous day, for example, stick to using the `Link` header's `updates` relation as described in the response section instead of `received-at`. There's no risk of missing invoices with it, incl. ones that arrive around the time of your request.

        If your URI library doesn't permit query parameters without values (`=`) at all, you can use `<<=` or `>>=` in place of `<` and `>`:

        | Parameter | Op | Description |
        |-----------|----|-------------|
        | `received-at<<=2025-06-18T…` | `<` | Received before 2025-06-18T… |
        | `received-at>>=2025-06-18T…` | `>` | Received after 2025-06-18T… |

      schema:
        type: string
        format: date-time
        example: "2015-06-18T13:37:42Z"

    orderReceivedAt:
      in: query
      name: received-at

      description: |
        Filter orders by `receivedAt` with UTC time in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`2025-06-18T13:37:42Z`).

        By (ab)using `<` and `>` in the parameter name and dropping `=`, you can form range queries:

        | Parameter | Op | Description |
        |-----------|----|-------------|
        | `received-at<2025-06-18T…` | `<` | Received before 2025-06-18T… |
        | `received-at<=2025-06-18T…` | `<=` | Received before or at 2025-06-18T… |
        | `received-at=2025-06-18T…` | `=` | Received exactly at 2025-06-18T… |
        | `received-at>=2025-06-18T…` | `>=` | Received after or at 2025-06-18T… |
        | `received-at>2025-06-18T…` | `>` | Received after 2025-06-18T… |

        You can repeat the parameter to target a specific month (e.g. June):  
        `/orders/received?received-at%3e=2025-06-01T00:00:00Z&received-at%3c2025-07-01T00:00:00Z`

        Don't forget to ensure **query parameters are properly encoded**. Under [RFC 3986](https://datatracker.ietf.org/doc/html/rfc3986), `<` and `>` are only permitted as `%3c` and `%3e` respectively. Most HTTP/URI libraries do this for you.

        Note that an order's **`receivedAt` is not monotonically increasing**. That is, "newer" orders may appear with older `receivedAt` times due to processing idiosyncrasies. If your goal is to grab newly arrived orders at midnights for the previous day, for example, stick to using the `Link` header's `updates` relation as described in the response section instead of `received-at`. There's no risk of missing orders with it, incl. ones that arrive around the time of your request.

        If your URI library doesn't permit query parameters without values (`=`) at all, you can use `<<=` or `>>=` in place of `<` and `>`:

        | Parameter | Op | Description |
        |-----------|----|-------------|
        | `received-at<<=2025-06-18T…` | `<` | Received before 2025-06-18T… |
        | `received-at>>=2025-06-18T…` | `>` | Received after 2025-06-18T… |

      schema:
        type: string
        format: date-time
        example: "2015-06-18T13:37:42Z"

    X-Send:
      in: header
      name: X-Send
      description: Request sending the invoice after creation.
      required: true

      schema:
        type: string
        enum:
          - "immediately"

    X-Forward:
      in: header
      name: X-Forward
      description: |
        Request forwarding the (received) invoice to the organization's operator.  
        If the organization doesn't accept e-invoices at any operator, you'll get `409 Organization Doesn't Accept E-Invoices`.

        Without the `X-Forward` header, the invoice will always be accepted, regardless of which operator, if any, the organization uses. It'll be only available locally from Billberry (and its API).

      schema:
        type: string
        enum:
          - "immediately"

  headers:
    InvoiceLink:
      schema:
        type: string
        example: |-
          </invoices/received?id%3e42>; rel="updates"

      description: |
        The `updates` URL can be used to request invoices added after the current response. This is useful for polling new invoices.

        See [RFC 8288](https://datatracker.ietf.org/doc/html/rfc8288) for the specification of the `Link` header. Note that link URLs can be either relative or absolute and there may be more than one link (with different `rel` values, though).

        The general pattern is that your first ever request should be to the `/received` path, but every consecutive request should go to the `updates` link returned by the last successful request. You can think of the `updates` link as a cursor to invoice changes or analogous to keeping track of the last request's date and time manually, except the updates link is abstract, more robust and simpler. Always save the entire updates link and don't depend on its implementation.

        You should save the updates link *after* a successful import on your side, not immediately when you get the response. When your importing fails mid-invoice, for example, you can fix your bug and just request again using the last updates link. This way you get everything you got before, but also anything that might've arrived after your last attempt. Don't forget to ignore invoices you've already successfully imported, though, as otherwise you'd create duplicates when retrying. You can use the invoice id to deduplicate received invoices.

    InvoiceAcknowledgementLink:
      schema:
        type: string
        example: |-
          </invoice-acknowledgements?id%3e13>; rel="updates"

      description: |
        The `updates` URL can be used to request acknowledgements added after the current response. This is useful for polling new acknowledgements.

        See [RFC 8288](https://datatracker.ietf.org/doc/html/rfc8288) for the specification of the `Link` header. Note that link URLs can be either relative or absolute and there may be more than one link (with different `rel` values, though).

        The general pattern is that your first ever request should be to the `/invoice-acknowledgements` path, but every consecutive request should go to the `updates` link returned by the last successful request. You can think of the `updates` link as a cursor to acknowledgement changes or analogous to keeping track of the last request's date and time manually, except the updates link is abstract, more robust and simpler. Always save the entire updates link and don't depend on its implementation.

        You should save the updates link *after* a successful import on your side, not immediately when you get the response. When your importing fails mid-acknowledgement, for example, you can fix your bug and just request again using the last updates link. This way you get everything you got before, but also anything that might've arrived after your last attempt.

    OrderLink:
      schema:
        type: string
        example: |-
          </orders/received?id%3e42>; rel="updates"

      description: |
        The `updates` URL can be used to request orders added after the current response. This is useful for polling new orders.

        See [RFC 8288](https://datatracker.ietf.org/doc/html/rfc8288) for the specification of the `Link` header. Note that link URLs can be either relative or absolute and there may be more than one link (with different `rel` values, though).

        The general pattern is that your first ever request should be to the `/received` path, but every consecutive request should go to the `updates` link returned by the last successful request. You can think of the `updates` link as a cursor to order changes or analogous to keeping track of the last request's date and time manually, except the updates link is abstract, more robust and simpler. Always save the entire updates link and don't depend on its implementation.

        You should save the updates link *after* a successful import on your side, not immediately when you get the response. When your importing fails mid-order, for example, you can fix your bug and just request again using the last updates link. This way you get everything you got before, but also anything that might've arrived after your last attempt. Don't forget to ignore orders you've already successfully imported, though, as otherwise you'd create duplicates when retrying. You can use the order id to deduplicate received orders.

  requestBodies:
    Einvoice:
      required: true

      description: |
        Billberry will detect the exact invoice format from the XML.  
        If you can or prefer to be explicit, set the `Content-Type` to one of the other `application.vnd.billberry.*` types.

      content:
        application/xml:
          schema:
            oneOf:
              - {$ref: "#/components/schemas/Earve"}
              - {$ref: "#/components/schemas/Teapps"}
              - {$ref: "#/components/schemas/UblInvoice"}
              - {$ref: "#/components/schemas/UblCreditNote"}

            description: |
              Detects the e-invoice type based on the XML element name.

        application/vnd.billberry.earve+xml:
          schema: {$ref: "#/components/schemas/Earve"}

        application/vnd.billberry.finvoice+xml:
          schema: {$ref: "#/components/schemas/Finvoice"}

        application/vnd.billberry.teapps+xml:
          schema: {$ref: "#/components/schemas/Teapps"}

        application/vnd.billberry.ubl-invoice+xml:
          schema: {$ref: "#/components/schemas/UblInvoice"}

        application/vnd.billberry.ubl-credit-note+xml:
          schema: {$ref: "#/components/schemas/UblCreditNote"}

  schemas:
    InvoiceV1:
      title: Invoice v1
      type: object
      x-summary: A sent or received invoice's metadata.
      x-content-type: application/vnd.billberry.invoice+json; v=1

      properties:
        id:
          type: integer
          example: 42
          description: |
            The invoice's id.  
            Generated by Billberry. Not from the e-invoice.

        type:
          type: string
          example: debit
          description: |
            The invoice's type — credit or debit.  
            For example, from the Estonian e-invoice format's `<E_Invoice>` `<Type>` element.

          enum:
            - "debit"
            - "credit"

        country:
          type: string
          example: EE
          enum: *countries
          description: |
            The country of the organization the invoice belongs to.  
            Matches either `senderCountry` if it's a sent invoice and `receiverCountry` if it was received.

        registryCode:
          type: string
          example: "16122596"
          description: |
            The organization the invoice belongs to.  
            Matches either `senderRegistryCode` if it's a sent invoice and `receiverRegistryCode` if it was received.

        senderCountry:
          example: EE

          anyOf:
            - type: "null"
            - type: string
              enum: *countries

          description: |
            The invoice sender/seller's country based on their registry code.  
            May be `null` if Billberry couldn't identify the registry code. Never `null` for an invoice sent _from_ Billberry.

        senderRegistryCode:
          type: string
          example: "16122596"
          description: |
            The invoice sender/seller's registry code.  
            From `<E_Invoice>` `<Invoice sellerRegnumber>`.

        senderName:
          type: [string, "null"]
          example: "Example Company OÜ"
          description: |
            The invoice sender/seller's name.  
            From `<E_Invoice>` `<SellerParty>` `<Name>`

        receiverCountry:
          example: EE

          anyOf:
            - type: "null"
            - type: string
              enum: *countries

          description: |
            The invoice receiver/buyer's country based on their registry code.  
            May be `null` if Billberry couldn't identify the registry code. Never `null` for an invoice received _by_ Billberry.

        receiverRegistryCode:
          type: string
          example: "16122596"
          description: |
            The invoice receiver/buyer's registry code.  
            From `<E_Invoice>` `<Invoice regNumber>`.

        receiverName:
          type: [string, "null"]
          example: "Example Company OÜ"
          description: |
            The invoice receiver/buyer's name.  
            From `<E_Invoice>` `<BuyerParty>` `<Name>`

        number:
          type: string
          example: INV123
          description: |
            The invoice's number as set by the sender.  
            From `<E_Invoice>` `<InvoiceNumber>`.

        date:
          type: string
          format: date
          description: |
            The date of the invoice as set by the sender.  
            From `<E_Invoice>` `<InvoiceDate>`.

          example: "2020-06-18"

        dueDate:
          type: [string, "null"]
          format: date
          example: "2020-06-25"

          description: |
            The due date of the invoice.  
            From `<E_Invoice>` `<InvoiceInformation>` `<DueDate>`.

        receivedAt:
          type: [string, "null"]
          format: date-time
          example: "2020-06-18T13:37:42.666Z"
          description: Time when the invoice was received.

        receivedFromOperator:
          example: billberry

          description: |
            The operator who sent the invoice to Billberry.

            Note that the operator list may change with time as operators enter and exit the market. A single operator's identifier will remain static however and won't be re-used.

            If you want to show the operator in a human-readable way to your app users, you may want a list of operator brand names, websites etc. Let us know and we'll add an API endpoint for that.

          anyOf:
            - type: "null"

            - type: string
              enum: &operators_or_networks
                - "billberry"
                - "earveldaja"
                - "finbite"
                - "telema"
                - "unifiedpost"
                - "peppol"

            - type: string

        receivedFileId:
          type: [string, "null"]
          deprecated: true
          example: "EMK_2021_153500000"
          description: |
            The received `<E_Invoice>` `<FileId>`.  
            Also set for invoices uploaded to Billberry for sending. May help with tracing invoices if problems occur.

            Only applicable to invoices received in the Estonian e-arve format.

        receivedExternalId:
          type: [string, "null"]
          example: "2221337"
          description: |
            The invoice id from an external operator.  
            Some operators, like [E-arveldaja](https://e-arveldaja.rik.ee), assign invoices an id of their own.  
            May help with tracing invoices if problems occur.

        sentAt:
          type: [string, "null"]
          format: date-time
          example: "2020-06-18T13:37:42.666Z"
          description: Time when the invoice was sent.

        sentToOperator:
          example: billberry

          anyOf:
            - type: "null"
            - type: string
              enum: *operators_or_networks
            - type: string

          description: |
            The operator to whom the invoice was sent to.

            Note that the operator list may change with time as operators enter and exit the market. A single operator's identifier will remain static however and won't be re-used.

            If you want to show the operator in a human-readable way to your app users, you may want a list of operator brand names, websites etc. Let us know and we'll add an API endpoint for that.

        sentFileId:
          type: [string, "null"]
          example: "42"
          description: |
            The sent `<E_Invoice>` `<FileId>` element.  
            Generated by Billberry and usually identical to the invoice id.  
            May help with tracing invoices if problems occur.

        sentExternalId:
          type: [string, "null"]
          example: "2221337"
          description: |
            The invoice id from an external operator.  
            Some operators, like [E-arveldaja](https://e-arveldaja.rik.ee), assign invoices an id of their own.  
            May help with tracing invoices if problems occur.

        delivery:
          anyOf:
            - type: "null"
            - $ref: "#/components/schemas/InvoiceDeliveryV1"

          description: |
            For now, present if you just sent the invoice.

        fileType:
          example: "application/vnd.billberry.earve+xml; v=1.2"

          description: |
            The MIME type of the e-invoice file.

            Note that the MIME type of the e-invoice files may have metadata attributes not listed here. For example, the Estonian e-arve may include a version — `application/vnd.billberry.earve+xml; v=1.2`. The UBL invoice may include the values of `<CustomizationID>` and `<ProfileID>` to help you identify the customization (e.g. compatibility with EN 16931 or with PEPPOL's BIS 3.0).

          anyOf:
            - type: "null"

            - type: string
              enum:
                - "application/vnd.billberry.earve+xml"
                - "application/vnd.billberry.finvoice+xml"
                - "application/vnd.billberry.teapps+xml"
                - "application/vnd.billberry.ubl-invoice+xml"
                - "application/vnd.billberry.ubl-credit-note+xml"

            - type: string

        pdfSize:
          type: integer
          example: 128
          minimum: 0
          description: |
            The size in bytes of the secondary accompanying PDF that one Estonian e-invoice operator (namely [E-arveldaja](https://e-arveldaja.rik.ee)) sends. That is, not via the `<E_Invoice>`'s `<AttachmentFile>` tag, but through a proprietary channel.

            As of Feb 23, 2023 **Billberry reattaches this externally sent PDF** to the e-invoice as an `<AttachmentFile>` element, making this path redundant. While it is theoretically possible for E-arveldaja to both send an attachment and a secondary PDF, it's unlikely and in our view not worth handling. Most other operators tend not to accept invoices with non-PDF attachments anyways, making them rare.

            If the size is non-zero, you can request the PDF via [`GET /invoices/{invoiceId}.pdf`](#GET+/invoices/{invoiceId}.pdf).

            Note that there might still be an attachment in the invoice, which you can get by downloading the original XML from [`GET /invoices/{invoiceId}.xml`](#GET+/invoices/{invoiceId}.xml) and extracting `<AttachmentFile>`.

    InvoiceDeliveryV1:
      title: Invoice Delivery v1
      type: object
      x-summary: An invoice's single delivery's metadata.
      x-content-type: application/vnd.billberry.invoice-delivery+json; v=1

      description: |
        A single invoice may be _delivered_ multiple times to multiple destinations, which then results in multiple deliveries. Usually sent invoices go to a single place, but received invoices may be mirrored to multiple places — e.g. an email notification and pushed to an accounting webapp.

      properties:
        id:
          type: integer
          example: 42
          description: |
            The invoice delivery's id.

        sentFileTypes:
          example: ["application/vnd.billberry.earve+xml; v=1.2"]

          description: |
            If the invoice was successfully sent, an array of MIME types of e-invoice file formats that were handed to the recipient's e-invoice operator. Usually a single type, but on the off chance a recipient supports and requests multiple formats (e.g. the original and a converted variant), this has to be an array.

            Also, theoretically it could be an empty array if all Billberry does is notify a recipient there's something to fetch from Billberry. As of 2025, there are no e-invoice operators that work in a pull-based fashion though.

            Note that the MIME type of the e-invoice files may have metadata attributes not listed here. For example, the Estonian e-arve may include a version — `application/vnd.billberry.earve+xml; v=1.2`. The UBL invoice may include the values of `<CustomizationID>` and `<ProfileID>` to help you identify the customization (e.g. compatibility with EN 16931 or with PEPPOL's BIS 3.0).

          type: [array, "null"]
          items:
            anyOf:
              - type: string
                enum:
                  - "application/vnd.billberry.earve+xml"
                  - "application/vnd.billberry.finvoice+xml"
                  - "application/vnd.billberry.teapps+xml"
                  - "application/vnd.billberry.ubl-invoice+xml"
                  - "application/vnd.billberry.ubl-credit-note+xml"

              - type: string

    InvoiceAcknowledgementV1:
      title: "Invoice Acknowledgement v1"
      type: object
      x-summary: Whether an invoice delivery was accepted or rejected.
      x-content-type: application/vnd.billberry.invoice-acknowledgement+json; v=1

      description: |
        An acknowledgement indicates whether a particular delivery of an invoice was confirmed or rejected by the recipient or their operator. Note that not all e-invoice networks, operators or recipients acknowledge invoices, so the lack of an acknowledgement doesn't indicate failure.

        Note that there may be multiple acknowledgements sent for a single invoice and delivery. It's up to the recipient, after all, to send them.

      properties:
        id:
          type: integer
          example: 42
          description: |
            The acknowledgement's id.

        invoiceId:
          type: integer
          example: 13
          description: |
            The invoice's id.

        invoiceDeliveryId:
          type: [integer, "null"]
          example: 37
          description:
            The invoice delivery's id related to the acknowledgement.

            Most acknowledgements are related to a single delivery. For example, since it's theoretically possible to request a single invoice to be delivered to two e-invoice networks in parallel, the delivery id helps identify which delivery was rejected by the recipient.

        ok:
          type: boolean
          example: false
          description: |
            Whether the delivery was accepted by the recipient or their operator.

        message:
          type: [string, "null"]
          example: "Duplicate invoice"
          description: |
            A message from the recipient or their operator explaining the acknowledgement. Usually present when `ok` is `false`.

        receivedAt:
          type: [string, "null"]
          format: date-time
          example: "2015-06-18T13:37:42Z"
          description: |
            Time when the acknowledgement was received from the recipient's system.

            If the acknowledgement was instead sent from Billberry to a sender, `receivedAt` will be `null`. That would be the case for rejections of received invoices, for example.

    Earve:
      title: Estonian E-arve
      type: object
      x-summary: An Estonian e-arve XML document.
      x-content-type: application/vnd.billberry.earve+xml

      description: |
        The Estonian e-invoice format.  
        Described in detail at <https://billberry.ee/help/dev/estonian-einvoice-standard/>.

      xml: {name: "E_Invoice"}

    Finvoice:
      title: Finnish Finvoice
      type: object
      x-summary: A Finnish Finvoice XML document.
      x-content-type: application/vnd.billberry.finvoice+xml

      description: |
        The Finnish e-invoice format "Finvoice".  
        Described in detail at <https://www.finanssiala.fi/en/topics/finvoice-standard/>.

      xml: {name: "Finvoice"}

    Teapps:
      title: Nordic TEAPPS
      type: object
      x-summary: A Nordic TEAPPS XML document.
      x-content-type: application/vnd.billberry.teapps+xml

      description: |
        The Nordic e-invoice format "TEAPPS".  
        Described in detail at <https://bix.tieto.com/#/teappsxml>.

      xml: {name: "INVOICE_CENTER"}

    UblInvoice:
      title: UBL Invoice
      type: object
      x-summary: A UBL Invoice XML document.
      x-content-type: application/vnd.billberry.ubl-invoice+xml

      description: |
        The UBL e-invoice format.  
        UBL v2.1 described in detail at <https://www.oasis-open.org/standard/ublv2-1/>.

      xml:
        name: "Invoice"
        namespace: "urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"

    UblCreditNote:
      title: UBL Credit Note
      type: object
      x-summary: A UBL Credit Note XML document.
      x-content-type: application/vnd.billberry.ubl-credit-note+xml

      description: |
        The UBL e-invoice format.  
        UBL v2.1 described in detail at <https://www.oasis-open.org/standard/ublv2-1/>.

      xml:
        name: "CreditNote"
        namespace: "urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2"

    UblOrder:
      title: UBL Order
      type: object
      x-summary: A UBL Order XML document.
      x-content-type: application/vnd.billberry.ubl-order+xml

      description: |
        The UBL e-order format.  
        UBL v2.1 described in detail at <https://www.oasis-open.org/standard/ublv2-1/>.

      xml:
        name: "Order"
        namespace: "urn:oasis:names:specification:ubl:schema:xsd:Order-2"

    OrderV1:
      title: Order v1
      type: object
      x-summary: A sent or received order's metadata.
      x-content-type: application/vnd.billberry.order+json; v=1

      properties:
        id:
          type: integer
          example: 42
          description: |
            The order's id.  
            Generated by Billberry. Not from the e-order.

        number:
          type: string
          example: PO123
          description: |
            The order's number as set by the sender.

        date:
          type: string
          format: date
          description: |
            The date of the order as set by the sender.

          example: "2020-06-18"

        organizationCountry:
          example: EE

          anyOf:
            - type: "null"
            - type: string
              enum: *countries

          description: |
            The country of the organization the order belongs to.

        organizationRegistryCode:
          type: [string, "null"]
          example: "16122596"
          description: |
            The registry code of the organization the order belongs to.

        senderName:
          type: [string, "null"]
          example: "Example Company OÜ"
          description: |
            The order sender/buyer's name.

        senderIds:
          type: array
          description: |
            The order sender/buyer's identifiers as read from the e-order.  
            Unfortunately the world is rather messy on how to identify legal entities of sellers and buyers.

          items: &order_party_id
            description: |
              Identifier types are distinguished by the `type` attribute.

              New identifier types are bound to show up in the future, so parse those you support and ignore the rest.

            oneOf:
              - type: object
                title: ISO 6523 Identifier
                required: [type, scheme, value]
                description: |
                  [ISO 6523](http://iso6523.info) is a public list of schemes (international code designators) that signify which register a particular identifier belongs to.

                  The **Estonian** organization registry code, for example, has a scheme of "0191". The **Finnish** business id has a scheme of "0212".

                  Since the maintainers of the list are regularly adding and deprecating entries, it's impossible to enumerate all valid schemes. At the end of the day, the actual seen values are coming from senders/receivers, so not only could old documents contain long-since deprecated values, they could also include invalid values.

                properties:
                  type: {type: string, const: "iso6523"}

                  scheme:
                    type: string
                    example: "0191"
                    description: The International Code Designator (ICD).

                  value:
                    type: string
                    example: "16122596"

              - type: object
                title: Other Identifiers
                required: [type]

                properties:
                  type:
                    type: string
                    not: {const: "iso6523"}
                    example: "…"

        senderEaddress:
          anyOf:
            - type: "null"

            - &order_eaddress
              description: |
                Identifier types are distinguished by the `type` attribute.

                New identifier types are bound to show up in the future, so parse those you support and ignore the rest.

              oneOf:
                - type: object
                  title: European Commission's Electronic Address Scheme (EAS)
                  required: [type, scheme, value]

                  description: |
                    Managed and published by the European Commission on their [code lists](https://ec.europa.eu/digital-building-blocks/sites/spaces/DIGITAL/pages/467108957/Code+lists) page.

                    It's also used in the PEPPOL network for participant identifiers. It's a combination of a subset of ISO 6523 schemes and some additions prefixed with "99" for codes that aren't in ISO 6523. Since not every ISO 6523 code is permitted here, it's not suitable for identifying all legal entities. Since the European Commission is regularly adding and deprecating entries, it's impossible to enumerate all valid schemes.

                  properties:
                    type: {type: string, const: "eas"}

                    scheme:
                      type: string
                      example: "0191"
                      description: The Electronic Address Scheme (EAS) code.

                    value:
                      type: string
                      example: "16122596"

                - type: object
                  title: Other Order Electronic Address
                  required: [type]

                  properties:
                    type:
                      type: string
                      not: {const: "eas"}
                      example: "…"

          description: |
            The order sender/buyer's electronic address.

        receiverName:
          type: [string, "null"]
          example: "Example Company OÜ"
          description: |
            The order receiver/seller's name.

        receiverIds:
          type: array
          items: *order_party_id
          description: |
            The order receiver/seller's identifiers as read from the e-order.  
            Unfortunately the world is rather messy on how to identify legal entities of sellers and buyers.

        receiverEaddress:
          anyOf:
            - type: "null"
            - *order_eaddress

          description: |
            The order receiver/seller's electronic address.

        receivedAt:
          type: [string, "null"]
          format: date-time
          example: "2020-06-18T13:37:42.666Z"

          description: |
            Time when the order was received.  
            Exclusive with `sentAt.`

        sentAt:
          type: [string, "null"]
          format: date-time
          example: "2020-06-18T13:37:42.666Z"

          description: |
            Time when the order was sent.  
            Exclusive with `sentAt.`

        fileType:
          example: "application/vnd.billberry.ubl-order+xml; v=2.1"

          description: |
            The MIME type of the e-order file.

            Note that the MIME type of the e-order files may have metadata attributes not listed here. For example, the UBL order includes its UBL version — `application/vnd.billberry.ubl-order+xml; v=2.1`.

          anyOf:
            - type: string
              enum:
                - "application/vnd.billberry.ubl-order+xml"

            - type: string

    CountryOrganizationV1:
      title: Country Organization v1
      type: object
      x-summary: An organization in a country's e-invoice receiver database.
      x-content-type: application/vnd.billberry.country-organization+json; v=1

      properties:
        country:
          type: string
          example: EE
          enum: *countries
          description: The country of the organization's registration.

        registryCode:
          type: string
          example: "16122596"

          description: |
            The registry code of the organization.

            In Estonia this will be the 8-digit code assigned by the Estonian Business Register.

        name:
          type: [string, "null"]
          example: "Example Company OÜ"

        receivingOperator:
          example: billberry

          anyOf:
            - type: "null"
            - type: string
              enum: *operators_or_networks
            - type: string

          description: |
            The e-invoice operator the organization uses for receiving. If you send an invoice via [`POST /invoices`](#POST+/invoices), Billberry will forward it to this operator.

            Note that the operator list may change with time as operators enter and exit the market. A single operator's identifier will remain static however and won't be re-used.

            If you want to show the operator in a human-readable way to your app users, you may want a list of operator brand names, websites etc. Let us know and we'll add an API endpoint for that.

    PartnerOrganizationV1:
      title: Partner Organization v1
      type: object
      x-summary: A partner's registered client organization.
      x-content-type: application/vnd.billberry.partner-organization+json; v=1

      properties:
        country:
          type: string
          example: EE
          enum: *countries
          description: |
            The country of the registered organization and its registry code.

        registryCode:
          type: string
          example: "16122596"
          description: |
            The registry code of the registered organization.

        createdAt:
          type: string
          format: date-time
          example: "2020-06-18T13:37:42.666Z"
          description: |
            Time when the organization was registered to the partner.

        deletedAt:
          type: [string, "null"]
          format: date-time
          example: "2020-06-18T13:37:42.666Z"
          description: |
            Time when the organization was unregistered from the partner.

        sendingEnabled:
          type: boolean
          example: true
          default: true
          description: |
            Whether e-invoice sending is enabled for this client.

        sendingNetworks:
          type: [object, "null"]

          example:
            estonia: true
            verkkolasku: true
            peppol: true
            estonian-banks: false

          description: |
            Which e-invoice networks to enable sending to this client. Takes effect only if `sendingEnabled` is `true`. If not given, uses defaults for new partner organizations. Unless you explicitly want to disable some networks, it's best to leave out.

            ## New Partner Organizations
            When registering a new partner organization without an explicit `sendingNetworks` object, it gets set to the default. Defaults listed below, but they may change as networks come and go. If you do pass an object, it overrides individual defaults. This way you can override a single network's default without having to set everything.

            ### Global Defaults
            - `estonia`
            - `verkkolasku`
            - `peppol`

            ## Existing Partner Organizations
            When updating existing partner organizations, the passed-in `sendingNetworks` will be merged with old values. For example, if `sendingNetworks` was `{"estonia": true, "peppol": false}` and your request sets only `{"peppol": true}`, the result will be `{"estonia": true, "peppol": true}`.

          properties:
            estonia:
              type: [boolean, "null"]
              example: true
              default: true

              description: |
                Whether to enable sending to the Estonian network.

            verkkolasku:
              type: [boolean, "null"]
              example: true
              default: true

              description: |
                Whether to enable sending to the Finnish Verkkolasku network.

            peppol:
              type: [boolean, "null"]
              example: true
              default: true

              description: |
                Whether to enable sending to the international PEPPOL network.

            estonian-banks:
              type: [boolean, "null"]
              example: false
              default: false

              description: |
                Whether to enable sending to Estonian banks for automated payments or direct debit.  
                Available only for Estonian senders.  
                Note that sending to banks **incurs fees**.

                Estonian banks other than Swedbank need to confirm new senders. That usually takes the banks' systems a few hours and happens behind the scenes. Until they do, you'll get a temporary 5xx error response trying to send to an unconfirmed bank. Confirming needs to be done only once and is remembered, so deleted and re-registered senders don't have to reconfirm.

                To simplify testing on Billberry's staging/test environment (<dev.billberry.ee), new bank senders are automatically confirmed in 5 minutes.

        receivingEnabled:
          type: boolean
          example: false
          default: false
          description: |
            Whether e-invoice receiving is enabled for this client.

            ## Receiving for Estonian Organizations
            Note than when you enable receiving for an Estonian organization, Billberry also sets itself as the client's e-invoice operator in the Estonian Business Register. To complete the process, you'll need to direct your client to the [Estonian Business Register](https://ariregister.rik.ee) to confirm their new operator.

        receivingNetworks:
          type: [object, "null"]
          example: {estonia: true, peppol: false}
          description: |
            Which e-invoice networks to enable receiving for this client. Takes effect only if `receivingEnabled` is `true`. If not given, uses country-specific defaults for new partner organizations. Unless you explicitly want to disable some networks, it's best to leave out.

            ## New Partner Organizations
            When registering a new partner organization without an explicit `receivingNetworks` object, it defaults to a country specific set of networks. Defaults listed below, but they may change as networks come and go. If an object _is_ given, it only sets the requested networks and leaves others off.

            ### Belgian Defaults
            - `peppol`

            ### Danish Defaults
            _None for now_

            ### Estonian Defaults
            - `estonia`

            ### Finnish Defaults
            - `peppol`

            ### German Defaults
            - `peppol`

            ### Latvian Defaults
            - `peppol`

            ### Lithuanian Defaults
            - `peppol`

            ### Swedish Defaults
            _None for now_

            ### Slovakian Defaults
            _None for now_

            ### Italian Defaults
            _None for now_

            ### Nigerian Defaults
            _None for now_

            ### Emirati Defaults
            - `peppol`

            ### Omani Defaults
            - `peppol`

            ## Existing Partner Organizations
            When updating existing partner organizations, the passed-in `receivingNetworks` will be merged with old values. For example, if `receivingNetworks` was `{"estonia": true}` and your request sets only `{"peppol": true}`, the result will be `{"estonia": true, "peppol": true}`.

          properties:
            estonia:
              type: [boolean, "null"]
              example: true
              default: false

              description: |
                Whether to enable receiving in the Estonian network.

            peppol:
              type: [boolean, "null"]
              example: false
              default: false

              description: |
                Whether to enable receiving in the international PEPPOL network.

        receivingOperator:
          example: billberry

          anyOf:
            - type: "null"
            - type: string
              enum: *operators_or_networks
            - type: string

          description: |
            The current receiving e-invoice operator for this client.

            If you've just enabled receiving for this client and the current operator is not "billberry", you'll need to direct your client to the [Estonian Business Register](https://ariregister.rik.ee) to confirm their new operator.

        creatingSentEnabled:
          type: boolean
          example: false
          default: false
          description: |
            Whether creating sent e-invoices is enabled for this client.

            Creating sent invoices is meant for uploading invoices sent externally, such as perhaps by email or post. Billberry doesn't send them again to the receiver, but will make them available to the client's accounting software.

        creatingReceivedEnabled:
          type: boolean
          example: false
          default: false
          description: |
            Whether creating received e-invoices is enabled for this client.

            Creating received invoices is meant for uploading invoices received externally, such as scanned purchase receipts, to Billberry, where they'll become available to the client's accounting software.

        orderSendingEnabled:
          type: boolean
          example: false
          default: false
          description: |
            Whether e-order sending is enabled for this client.

        orderReceivingEnabled:
          type: boolean
          example: false
          default: false
          description: |
            Whether e-order receiving is enabled for this client.

        orderReceivingNetworks:
          type: [object, "null"]
          example: {peppol: true}
          description: |
            Which e-order networks to enable receiving for this client. Takes effect only if `orderReceivingEnabled` is `true`. If not given, uses country-specific defaults for new partner organizations. Unless you explicitly want to disable some networks, it's best to leave out.

            ## New Partner Organizations
            When registering a new partner organization without an explicit `orderReceivingNetworks` object, it gets set to the default. Defaults listed below, but they may change as networks come and go. If you do pass an object, it overrides individual defaults. This way you can override a single network's default without having to set everything.

            ### Global Defaults
            - `peppol`

            ### Nigerian Defaults
            _None for now_

            ## Existing Partner Organizations
            When updating existing partner organizations, the passed-in `orderReceivingNetworks` will be merged with old values.

          properties:
            peppol:
              type: [boolean, "null"]
              example: true
              default: true

              description: |
                Whether to enable receiving in the international PEPPOL network.

    SessionV1:
      title: Session v1
      type: object
      x-summary: A session used for authentication to the API.
      x-content-type: application/vnd.billberry.session+json; v=1

      properties:
        id:
          type: integer
          example: 42
          description: |
            The session's id.  
            This will become the HTTP Basic Authentication username for authentication.  
            For the password, see `token`.

        country:
          type: string
          example: EE
          enum: *countries
          description: |
            The country of the organization's registry code.

        registryCode:
          type: string
          example: "16122596"
          description: |
            The registry code of the organization this session gives access to.

        createdAt:
          type: string
          format: date-time
          example: "2020-06-18T13:37:42.666Z"
          description: |
            Time when the session was created.

        token:
          type: [string, "null"]
          format: password
          pattern: "^[0-9a-z]$"
          example: "2ab96390c7dbe3439de74d0c9b0b1767"
          description: |
            The session token.  
            This will become the HTTP Basic Authentication password for authentication.

            This is only returned once after creating the session.

    Error:
      title: Error v1
      type: object
      x-summary: An error response.
      x-content-type: application/vnd.billberry.error+json; v=1

      properties:
        code:
          type: integer
          example: 403
          description: |
            The HTTP status code.

            Follows the same rules as defined by HTTP:
            - `2xx` codes indicate success.
            - `4xx` codes indicate client issues. No point in retrying.
            - `5xx` codes indicate Billberry or downstream issues. Retry later.

        message:
          type: string
          example: "Some Error"
          description: |
            The title-cased error message. Same as the HTTP status message.

        description:
          type: [string, "null"]
          example: "Something went wrong when fooing the bars."
          description: |
            A human readable multiline explanation of what went wrong. Currently available only in English, but in the future could be translated based on the `Accept-Language` HTTP header. For example, feel free to set it to `Accept-Language: et` for Estonian. Given an unknown language code, English will be returned.

            It's safe to show to end-users, although it may contain technical details from other operators. Could be better than just showing "Something went wrong" though. ;)

            If you're going to display it, make sure to honor newlines. It could be a long message should it include technical errors from other operators.

    Pdf:
      title: PDF
      type: string
      x-summary: A PDF document.
      format: binary
      contentMediaType: application/pdf

      example: |
        %PDF-1.0
        1 0 obj<</Pages 2 0 R>>endobj 2 0 obj<</Kids[3 0 R]/Count 1>>endobj 3 0 obj<</MediaBox[0 0 3 3]>>endobj
        trailer<</Root 1 0 R>>
